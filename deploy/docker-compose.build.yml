# Build the Docker image from this checkout and run it.
# Usage (from the repository root): docker compose -f deploy/docker-compose.build.yml up -d --build

services:
  podux:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # A release tag such as v0.2.3 sets the app version; anything else keeps the dev default.
        VERSION: ${VERSION:-dev}
    image: podux:${VERSION:-dev}
    container_name: podux
    restart: unless-stopped

    # Host network: 127.0.0.1 in a proxy's local address is the host itself.
    network_mode: host

    # A named volume needs no chown; Docker gives it to the container user.
    volumes:
      - podux-data:/app/pb_data

    environment:
      - TZ=Asia/Shanghai

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  podux-data:
