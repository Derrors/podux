# Podux with Docker Compose. See https://derrors.github.io/podux/deploy/install/docker.html
#
# The container runs as UID 1000, so create the data directory and hand it over first:
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d
#
# Pin a version with VERSION=0.2.3 docker compose up -d (defaults to latest).

services:
  podux:
    image: ghcr.io/derrors/podux:${VERSION:-latest}
    container_name: podux
    restart: unless-stopped

    # Host network: 127.0.0.1 in a proxy's local address is the host itself.
    # For the bridge network, remove this line and publish the port instead:
    #   ports:
    #     - "8090:8090"
    # 127.0.0.1 then means the container, so enter the host's LAN IP in proxies.
    network_mode: host

    volumes:
      - ./data:/app/pb_data

    environment:
      - TZ=Asia/Shanghai

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
