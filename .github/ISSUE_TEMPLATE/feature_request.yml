name: 功能建议 / Feature request
description: 提出新功能或改进建议 / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你想解决什么问题，现在是怎么做的 / What problem you want to solve and how you handle it today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能 / Proposal
      description: 你希望 Podux 怎样支持它 / How you would like Podux to support it
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 考虑过的其他做法或参考 / Other approaches or references you considered
