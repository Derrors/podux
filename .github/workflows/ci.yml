name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Frontend: lint + build
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Lint
        run: pnpm run lint
        working-directory: site

      - name: Test
        run: pnpm run test
        working-directory: site

      # build runs `tsc -b`, so it is also the type check
      - name: Build
        run: pnpm run build
        working-directory: site

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: site/dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # Docs: build the VitePress site (fails on dead links)
  # ──────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      - name: Build
        run: pnpm run docs:build
        working-directory: docs

  # ──────────────────────────────────────────────
  # Backend: vet + build (linux/amd64 only for speed)
  # ──────────────────────────────────────────────
  backend:
    name: Backend
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: pb_public/

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags "-s -w" \
            -o /tmp/podux \
            main.go

  # ──────────────────────────────────────────────
  # End-to-end: the built binary against a real frps (test/e2e/run.sh)
  # ──────────────────────────────────────────────
  e2e:
    name: End-to-end
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: pb_public/

      - name: Build Podux and the webhook catcher
        run: |
          go build -o /tmp/podux .
          go build -o /tmp/catcher ./test/e2e/catcher

      # The same frp release as the embedded frpc.
      - name: Download frps
        run: |
          FRP_VERSION=$(go list -m -f '{{.Version}}' github.com/fatedier/frp | sed 's/^v//')
          curl -fsSL "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
          mv "/tmp/frp_${FRP_VERSION}_linux_amd64/frps" /tmp/frps

      - name: Run
        env:
          PODUX_BIN: /tmp/podux
          FRPS_BIN: /tmp/frps
          CATCHER_BIN: /tmp/catcher
        run: sh test/e2e/run.sh

  # ──────────────────────────────────────────────
  # Docker: build & push :dev image (dev branch only)
  # ──────────────────────────────────────────────
  docker-dev:
    name: Docker (dev tag)
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; github.repository keeps the owner's case.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.image.outputs.name }}:dev
          build-args: |
            VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
